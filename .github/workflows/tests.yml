name: Tests

# The board's checks and its Firstmate adapter's suites, on every push to and
# pull request into main. No `paths:` filter, so every pull request reports.
#
# Board: the board's own checks at this repository's root.
# Firstmate adapter: the adapter's suites source Firstmate's tests/lib.sh and
#   run Firstmate's real scripts, so they run in a checkout of guybeju/firstmate
#   (public, read without a token) at FIRSTMATE_COMMIT, with this repository's
#   board files and adapters/firstmate/* laid over its root and committed there
#   locally: the shape a Firstmate fork has after vendoring this repository.
# macOS bash 3.2: /bin/bash -n on every shell file, then the suites that run on
#   macOS's BSD tools without a browser, with macOS's own /bin/bash first on
#   PATH so every script and every `#!/usr/bin/env bash` gets 3.2.
#
# The suites print `skip:` and still pass when a tool is missing. Each job
# installs the tools its suites use, so any skip fails the job and is listed as
# NOT RUN in the job summary; a job never passes having checked nothing.
#
# The repository's Actions settings allow only actions pinned to a full commit
# SHA, so every `uses:` carries one, with its release tag in the comment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read the repository and nothing else.
permissions:
  contents: read

# A new push to the same pull request cancels its older run; runs on main
# each finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The guybeju/firstmate commit the adapter is tested against: the commit the
  # import came from. Changing it is a pull request here.
  FIRSTMATE_COMMIT: 763b758ba65ccf0d5d766690c7195c8b39602a29

defaults:
  run:
    # Explicit bash adds -o pipefail, so `stage | tee log` fails with the stage.
    shell: bash

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Board
            os: ubuntu-24.04
            firstmate: false
            bash32: false
            stages: |
              bash board/myshape/test/check-dist.sh
              pnpm --dir board/myshape test
              pnpm --dir board/myshape run typecheck
              pnpm --dir board/myshape run lint
              pnpm --dir board/myshape run format:check
              board/myshape/test/run.sh
          - name: Firstmate adapter
            os: ubuntu-24.04
            firstmate: true
            bash32: false
            stages: |
              firstmate/dispatch-plan/test/run.sh
              firstmate/fm-board/test/run.sh
          # Left out here, each for what it needs that this job does not set
          # up: GNU sed, for `sed -i` with no suffix (myshape
          # stage-7-aggregator) and \n in a replacement (myshape
          # stage-7-isolation); firefox on PATH (myshape stage-7-page, fm-board
          # stage-5-page); sha256sum, called without a shasum fallback
          # (myshape stage-7-standalone, fm-board stage-1-feed and
          # stage-7-upgrade), which the Show tools step reports; and a ps that
          # names a script's process after the script (fm-board
          # stage-2-startup, which prints skip: otherwise).
          - name: macOS bash 3.2
            os: macos-15
            firstmate: true
            bash32: true
            stages: |
              /bin/bash board/myshape/test/run.sh 1 2
              /bin/bash firstmate/dispatch-plan/test/run.sh
              /bin/bash firstmate/myshape/test/check-signals.sh
              /bin/bash firstmate/fm-board/test/stage-1-read.sh
              /bin/bash firstmate/fm-board/test/stage-1-tag.sh
              /bin/bash firstmate/fm-board/test/stage-2-deliver.sh
              /bin/bash firstmate/fm-board/test/stage-2-topics-tag.sh
              /bin/bash firstmate/fm-board/test/stage-3-data.sh
              /bin/bash firstmate/fm-board/test/stage-3-handson-holds.sh
              /bin/bash firstmate/fm-board/test/stage-3-split.sh
              /bin/bash firstmate/fm-board/test/stage-4-binding.sh
              /bin/bash firstmate/fm-board/test/stage-4-writes.sh
              /bin/bash firstmate/fm-board/test/stage-5-http.sh
              /bin/bash firstmate/fm-board/test/stage-6-guide.sh
              /bin/bash firstmate/fm-board/test/stage-6-rules.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: board
          persist-credentials: false
      - name: Check out guybeju/firstmate at FIRSTMATE_COMMIT
        if: matrix.firstmate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: guybeju/firstmate
          ref: ${{ env.FIRSTMATE_COMMIT }}
          path: firstmate
          persist-credentials: false
          # fm-board stage-3-handson-holds.sh and stage-7-upgrade.sh read older
          # Firstmate commits.
          fetch-depth: 0
      - name: Lay the board and the adapter over the Firstmate root
        if: matrix.firstmate
        # The paths the import took from Firstmate are replaced by this
        # repository's copies and committed in the runner's checkout, so the
        # suites see them tracked and unchanged, as in a vendoring fork. The
        # commit stays on the runner; nothing is pushed.
        run: |
          imported=(
            bin/myshape.sh bin/myshape-lib.sh myshape ci-tools/board-tests
            bin/fm-board.sh bin/fm-board-lib.sh bin/fm-board-io-lib.sh
            bin/fm-dispatch-plan.sh bin/fm-topic-board-read.sh
            bin/fm-topic-session-start.sh bin/fm-queue-source-lib.sh
            fm-board dispatch-plan
          )
          git -C firstmate rm -r -q -- "${imported[@]}"
          cp board/bin/myshape.sh board/bin/myshape-lib.sh firstmate/bin/
          cp -R board/myshape firstmate/
          mkdir -p firstmate/ci-tools
          cp -R board/ci-tools/board-tests firstmate/ci-tools/
          cp -R board/adapters/firstmate/. firstmate/
          git -C firstmate add -A
          git -C firstmate -c user.name='myshape CI' -c user.email='ci@example.invalid' \
            commit -q --allow-empty -m "Lay guybeju/myshape@$GITHUB_SHA over the root"
          echo "Changed against $FIRSTMATE_COMMIT:"
          git -C firstmate diff --stat "$FIRSTMATE_COMMIT" HEAD
          if [ -n "$(git -C firstmate status --porcelain)" ]; then
            echo '::error::the laid-over checkout has uncommitted changes'
            git -C firstmate status --short
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pnpm and tasks-axi from the CI lockfile
        # ci-tools/board-tests locks both tools for CI only; myshape/ declares
        # no pnpm version. No package script runs.
        run: |
          npm ci --ignore-scripts --prefix board/ci-tools/board-tests
          echo "$GITHUB_WORKSPACE/board/ci-tools/board-tests/node_modules/.bin" >> "$GITHUB_PATH"
      - name: pnpm install --frozen-lockfile
        run: |
          pnpm --dir board/myshape install --frozen-lockfile
          if [ -d firstmate ]; then
            pnpm --dir firstmate/myshape install --frozen-lockfile
          fi
      - name: Put macOS's /bin/bash 3.2 first on PATH
        if: matrix.bash32
        run: |
          version=$(/bin/bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')
          echo "/bin/bash is $version"
          if [ "$version" != 3.2 ]; then
            echo "::error::/bin/bash is $version, not 3.2"
            exit 1
          fi
          echo /bin >> "$GITHUB_PATH"
      - name: /bin/bash -n on every shell file
        if: matrix.bash32
        # A shell file is a tracked *.sh, or a tracked file whose first line is
        # a sh or bash shebang.
        run: |
          checked=0
          failed=0
          while IFS= read -r file; do
            case "$file" in
              *.sh) ;;
              *) head -n 1 "board/$file" | grep -qE '^#!.*(/|env )(ba)?sh([[:space:]]|$)' || continue ;;
            esac
            checked=$((checked + 1))
            if ! /bin/bash -n "board/$file"; then
              failed=1
              echo "::error file=$file::/bin/bash -n failed"
            fi
          done < <(git -C board ls-files)
          echo "/bin/bash -n: $checked files" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$checked" -gt 0 ] || { echo '::error::no shell file found'; exit 1; }
          exit "$failed"
      - name: Show tools
        run: |
          {
            echo '## Tools'
            echo
            echo '| Tool | Path | Version |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for tool in bash git jq curl ps sha256sum shasum ss lsof pgrep sed node npm pnpm tasks-axi firefox; do
            path=$(command -v "$tool" || echo 'missing')
            # stderr is dropped: firefox writes a sandbox warning there first.
            case "$tool" in
              ps|ss|pgrep) version=$("$tool" -V 2>/dev/null | head -n 1 || true) ;;
              lsof) version=$("$tool" -v 2>&1 | grep -m 1 -i revision || true) ;;
              *) version=$("$tool" --version 2>/dev/null | head -n 1 || true) ;;
            esac
            echo "$tool: $path: $version"
            echo "| $tool | $path | $version |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Run the stages
        # Every stage runs even after one fails, so one run shows them all. Each
        # logs to $RUNNER_TEMP/stages/<n>.log; its result and duration go to the
        # summary. Any `skip:` line in a log is a NOT RUN line and fails the job.
        env:
          STAGES: ${{ matrix.stages }}
        run: |
          stages=()
          while IFS= read -r line; do
            [ -z "$line" ] || stages+=("$line")
          done <<< "$STAGES"
          logs=$RUNNER_TEMP/stages
          mkdir -p "$logs"
          {
            echo
            echo '## Stages'
            echo
            echo '| Stage | Result | Seconds |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          not_run=()
          for i in "${!stages[@]}"; do
            stage=${stages[$i]}
            read -ra command <<< "$stage"
            echo "::group::$stage"
            start=$SECONDS
            rc=0
            "${command[@]}" 2>&1 | tee "$logs/$i.log" || rc=$?
            echo "::endgroup::"
            result=passed
            if [ "$rc" -ne 0 ]; then
              result="failed (exit $rc)"
              failed=1
              echo "::error::$stage failed with exit $rc"
            fi
            echo "| \`$stage\` | $result | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              not_run+=("NOT RUN: $stage: $line")
            done < <(grep -E '^(ok - )?skip:' "$logs/$i.log" || true)
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "${#not_run[@]}" -eq 0 ]; then
            echo 'No stage printed a skip: line.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            failed=1
            for line in "${not_run[@]}"; do
              echo "::error::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          exit "$failed"
